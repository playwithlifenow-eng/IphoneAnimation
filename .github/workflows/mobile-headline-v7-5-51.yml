name: Mobile headline v7.5.51

on:
  push:
    branches:
      - feature/mobile-headline-v7-5-51

permissions:
  contents: write

jobs:
  materialize-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Materialize audited R3F source
        run: python3 scripts/materialize-mobile-headline-v7-5-51.py
      - name: Verify source hash
        run: echo '6b89042801dde2e2b2d71165f544394d239722e6cfba40f048cadcd3e234b666  src/CrossSection3DScrollGLB.jsx' | sha256sum --check
      - name: Install dependencies without mutating stale lockfile
        run: |
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --no-package-lock --legacy-peer-deps --no-audit --no-fund ajv@8.17.1 ajv-keywords@5.1.0 typescript@5.9.3
      - name: Build
        run: npm run build
      - name: Commit materialized source
        run: |
          if git diff --quiet -- src/CrossSection3DScrollGLB.jsx; then
            echo 'Source already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CrossSection3DScrollGLB.jsx
          git commit -m 'Materialize v7.5.51 mobile headline telemetry'
          git push
