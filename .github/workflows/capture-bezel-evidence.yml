name: Capture GPU bezel mask acceptance evidence

on:
  push:
    branches:
      - diagnostic/bezel-gpu-mask

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[bezel-evidence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser capture dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Build exact diagnostic branch and serve locally
        shell: bash
        run: |
          set -euo pipefail
          DISABLE_ESLINT_PLUGIN=true npm run build
          python3 -m http.server 4173 --directory build > /tmp/iglass-serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 'http://127.0.0.1:4173/bezel-mask-harness.html' | grep -q 'iGlass bezel mask diagnostic'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iglass-serve.log || true
          exit 1

      - name: Capture all requested and intermediate frames
        id: capture
        shell: bash
        run: |
          set +e
          mkdir -p .diagnostics/bezel-mask-evidence
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.diagnostics/capture-bezel-evidence.mjs')
          s = p.read_text()
          s = s.replace(
              "const BASE = 'https://iphone-animation-git-diag-87a40c-playwithlifenow-8152s-projects.vercel.app';",
              "const BASE = process.env.DIAG_BASE || 'https://iphone-animation-git-diag-87a40c-playwithlifenow-8152s-projects.vercel.app';",
          )
          s = s.replace(
              "child=page.frames().find(f=>f!==page.mainFrame() && /iphone-animation/.test(f.url()));",
              "child=page.frames().find(f=>f!==page.mainFrame());",
          )
          p.write_text(s)
          PY
          DIAG_BASE='http://127.0.0.1:4173' node .diagnostics/capture-bezel-evidence.mjs 2>&1 | tee .diagnostics/bezel-mask-evidence/run.log
          CODE=${PIPESTATUS[0]}
          echo "$CODE" > .diagnostics/bezel-mask-evidence/exit-code.txt
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit empirical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'iGlass diagnostic bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -- .diagnostics/capture-bezel-evidence.mjs
          git add .diagnostics/bezel-mask-evidence
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit'
          else
            git commit -m 'Capture GPU bezel mask acceptance evidence [bezel-evidence]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Enforce automated acceptance gates
        if: always()
        shell: bash
        run: |
          CODE='${{ steps.capture.outputs.code }}'
          if [ -z "$CODE" ]; then CODE=1; fi
          exit "$CODE"
