name: Apply bezel GPU mask diagnostic

on:
  push:
    branches:
      - diagnostic/bezel-gpu-mask

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bezel-mask-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .diagnostics/bezelmask_repo.patch ]; then
            echo "Patch payload absent; nothing to apply."
            exit 0
          fi
          git apply --check .diagnostics/bezelmask_repo.patch
          git apply .diagnostics/bezelmask_repo.patch
          git config user.name "iGlass diagnostic bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/CrossSection3DScrollGLB.jsx
          git commit -m "Add development-only GPU bezel semantic mask [bezel-mask-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
